<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order — Elaichi × WEF Davos 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .page-header {
      background: linear-gradient(135deg, #2D1A00, #1A1A1A);
      color: white;
      padding: 60px 24px;
      text-align: center;
    }
    .page-header h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 8px; }
    .page-header h1 span { color: var(--saffron); }
    .page-header p { color: rgba(255,255,255,0.6); font-size: 0.95rem; }

    /* Order lookup */
    .lookup-card {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .lookup-box {
      background: var(--white);
      border-radius: var(--radius-md);
      border: 1.5px solid var(--mist);
      padding: 28px;
    }
    .lookup-box h3 { margin-bottom: 16px; font-size: 1.05rem; }
    .lookup-input-row {
      display: flex;
      gap: 10px;
    }
    .lookup-input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--mist);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: var(--font-mono);
      outline: none;
      text-transform: uppercase;
      transition: border-color var(--transition);
    }
    .lookup-input-row input:focus { border-color: var(--saffron); }
    .lookup-input-row button {
      padding: 12px 20px;
      background: var(--saffron);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.9rem;
      transition: background var(--transition);
    }
    .lookup-input-row button:hover { background: var(--saffron-dark); }

    /* Recent orders */
    .recent-orders { margin-top: 20px; }
    .recent-orders h4 { font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 10px; }
    .recent-order-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--cream-dark);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      transition: background var(--transition);
      border: 1.5px solid transparent;
    }
    .recent-order-chip:hover { background: var(--mist); border-color: var(--saffron-light); }
    .recent-order-chip .oc-id { font-family: var(--font-mono); font-weight: 700; font-size: 0.88rem; }
    .recent-order-chip .oc-info { font-size: 0.8rem; color: var(--ink-soft); }
    .recent-order-chip .oc-status { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-full); }
    .status-confirmed { background: #fff3cd; color: #8a6d00; }
    .status-preparing { background: rgba(232,168,56,0.15); color: var(--saffron-dark); }
    .status-on_the_way { background: rgba(108,92,231,0.12); color: var(--indigo); }
    .status-delivered { background: #e8f5e9; color: var(--cardamom); }
    .status-ready { background: rgba(232,168,56,0.15); color: var(--saffron-dark); }

    /* Tracking view */
    .tracking-layout {
      max-width: 900px;
      margin: 0 auto 60px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 768px) { .tracking-layout { grid-template-columns: 1fr; } }

    .track-card {
      background: var(--white);
      border-radius: var(--radius-md);
      border: 1.5px solid var(--mist);
      padding: 28px;
      margin-bottom: 20px;
    }
    .track-card h3 { font-size: 1rem; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--mist); display: flex; align-items: center; gap: 8px; }

    /* Big status display */
    .status-hero {
      text-align: center;
      padding: 32px;
      background: linear-gradient(135deg, var(--cream-dark), var(--mist));
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }
    .status-big-icon { font-size: 4rem; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .status-big-label { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .status-big-desc { color: var(--ink-soft); font-size: 0.9rem; }
    .eta-pill {
      display: inline-block;
      background: var(--saffron);
      color: white;
      padding: 6px 18px;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 12px;
    }

    /* Timeline */
    .timeline { position: relative; }
    .timeline-item {
      display: flex;
      gap: 16px;
      padding-bottom: 24px;
      position: relative;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 19px;
      top: 40px;
      bottom: 0;
      width: 2px;
      background: var(--mist);
    }
    .timeline-item.done::before { background: linear-gradient(var(--cardamom), var(--mist)); }
    .timeline-item:last-child::before { display: none; }
    .tl-dot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      position: relative;
      z-index: 1;
    }
    .tl-dot.done { background: var(--cardamom); color: white; }
    .tl-dot.active { background: var(--saffron); color: white; animation: pulse 1.5s ease-in-out infinite; }
    .tl-dot.pending { background: var(--mist); color: var(--ink-soft); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(232,168,56,0.4); }
      50% { box-shadow: 0 0 0 10px rgba(232,168,56,0); }
    }
    .tl-content { flex: 1; padding-top: 6px; }
    .tl-content strong { display: block; font-size: 0.92rem; margin-bottom: 2px; }
    .tl-content span { font-size: 0.8rem; color: var(--ink-soft); }
    .tl-time { font-size: 0.75rem; color: var(--saffron-dark); font-weight: 600; margin-top: 2px; }

    /* Progress bar */
    .progress-track {
      height: 6px;
      background: var(--mist);
      border-radius: 3px;
      margin: 20px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--saffron-dark), var(--saffron));
      border-radius: 3px;
      transition: width 1s ease;
    }

    /* Order summary sidebar */
    .order-summary-side {
      background: var(--white);
      border-radius: var(--radius-md);
      border: 1.5px solid var(--mist);
      padding: 24px;
      position: sticky;
      top: 88px;
    }
    .order-summary-side h3 { font-size: 1rem; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--mist); }
    .side-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--cream-dark);
      font-size: 0.85rem;
    }
    .side-item:last-of-type { border-bottom: none; }
    .side-total { font-weight: 700; font-family: var(--font-mono); }
    .info-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; }
    .info-row .label { color: var(--ink-soft); }

    /* Simulate progress button (demo) */
    .demo-controls {
      background: rgba(108,92,231,0.06);
      border: 1px solid rgba(108,92,231,0.2);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-top: 16px;
      text-align: center;
    }
    .demo-controls p { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 8px; }
    .demo-controls button {
      padding: 8px 16px;
      background: var(--indigo);
      color: white;
      border: none;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      transition: background var(--transition);
    }
    .demo-controls button:hover { background: #5849c9; }

    .hide-xs { }
    @media (max-width: 640px) {
      .hide-xs { display: none; }
      .page-header { padding: 40px 16px; }
      .lookup-card { padding: 0 12px; margin: 24px auto; }
      .lookup-box { padding: 20px; }
      .lookup-input-row { flex-direction: column; }
      .lookup-input-row button { width: 100%; padding: 14px; }
      .tracking-layout { padding: 0 12px; gap: 16px; margin-bottom: 40px; }
      .status-hero { padding: 24px 16px; }
      .status-big-icon { font-size: 3rem; }
      .status-big-label { font-size: 1.3rem; }
      .track-card { padding: 16px; }
      .order-summary-side { padding: 16px; position: static; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="Elaichi Logo.png" alt="Elaichi" onerror="this.style.display='none'" />
        Elaichi<span>.</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="tracking.html" class="active">Track Order</a></li>
      </ul>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="cart.html" class="cart-btn">
          <span>🛒</span>
          <span class="hide-xs">Cart</span>
          <span class="cart-badge">0</span>
        </a>
        <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu" onclick="closeMenu(event)">
    <div class="mobile-menu-panel">
      <a href="index.html">🏠 Home</a>
      <a href="menu.html">🍛 Menu</a>
      <a href="tracking.html" class="active">📍 Track Order</a>
      <a href="cart.html" class="menu-cart-btn">🛒 View Cart</a>
    </div>
  </div>

  <div class="page-header">
    <h1>Track Your <span>Order</span></h1>
    <p>Real-time updates on your Elaichi order</p>
  </div>

  <div id="mainContent"></div>

  <script src="app.js"></script>
  <script>
    const DELIVERY_STEPS = [
      { key: 'confirmed', icon: '✅', label: 'Order Confirmed', desc: 'We\'ve received and confirmed your order' },
      { key: 'preparing', icon: '👨‍🍳', label: 'Preparing', desc: 'Our chefs are crafting your meal with love' },
      { key: 'ready', icon: '📦', label: 'Packed & Ready', desc: 'Your order is packed and ready for the rider' },
      { key: 'on_the_way', icon: '🛵', label: 'On the Way!', desc: 'Your rider is heading to your address' },
      { key: 'delivered', icon: '🏠', label: 'Delivered!', desc: 'Your order has been delivered. Enjoy!' },
    ];
    const PICKUP_STEPS = [
      { key: 'confirmed', icon: '✅', label: 'Order Confirmed', desc: 'We\'ve received and confirmed your order' },
      { key: 'preparing', icon: '👨‍🍳', label: 'Preparing', desc: 'Our chefs are crafting your meal with love' },
      { key: 'ready', icon: '🔔', label: 'Ready for Pickup!', desc: 'Your order is ready. Come collect it!' },
      { key: 'collected', icon: '🎉', label: 'Collected', desc: 'Thanks for dining with us!' },
    ];
    const ETA_BY_STEP = { confirmed: '~40 min', preparing: '~25 min', ready: '~10 min', on_the_way: '~10 min', delivered: 'Done!', collected: 'Done!' };

    let currentOrder = null;
    let stepIdx = 0;

    function getSteps(order) {
      return order.deliveryType === 'delivery' ? DELIVERY_STEPS : PICKUP_STEPS;
    }

    function renderLookup(orders) {
      const recentHtml = orders.length ? `
        <div class="recent-orders">
          <h4>Recent Orders</h4>
          ${orders.slice(0, 3).map(o => `
            <div class="recent-order-chip" onclick="showTracking('${o.id}')">
              <div>
                <div class="oc-id">#${o.id}</div>
                <div class="oc-info">${o.items.length} item${o.items.length > 1 ? 's' : ''} · ${formatPrice(o.total)} · ${new Date(o.placedAt).toLocaleDateString('en-CH')}</div>
              </div>
              <span class="oc-status status-${o.status}">${o.status.replace('_', ' ')}</span>
            </div>`).join('')}
        </div>` : '<p style="font-size:0.85rem;color:var(--ink-soft);text-align:center;margin-top:12px;">No recent orders. Place your first order!</p>';

      return `
        <div class="lookup-card">
          <div class="lookup-box">
            <h3>🔍 Find Your Order</h3>
            <div class="lookup-input-row">
              <input type="text" id="orderInput" placeholder="Enter order ID (e.g. EL1A2B3C)" />
              <button onclick="lookupOrder()">Track</button>
            </div>
            ${recentHtml}
            <div style="text-align:center; margin-top:20px;">
              <a href="menu.html" class="btn btn-primary">Order Now →</a>
            </div>
          </div>
        </div>`;
    }

    function renderTracking(order) {
      const steps = getSteps(order);
      stepIdx = steps.findIndex(s => s.key === order.status);
      if (stepIdx === -1) stepIdx = 0;

      const progress = Math.round((stepIdx / (steps.length - 1)) * 100);
      const currentStep = steps[stepIdx];
      const isDelivered = order.status === 'delivered' || order.status === 'collected';

      const timelineHtml = steps.map((step, i) => {
        const isDone = i < stepIdx;
        const isActive = i === stepIdx;
        const isPending = i > stepIdx;
        const timeEntry = order.timeline?.find(t => t.status === step.key);
        return `
          <div class="timeline-item ${isDone ? 'done' : ''}">
            <div class="tl-dot ${isDone ? 'done' : isActive ? 'active' : 'pending'}">${isDone ? '✓' : step.icon}</div>
            <div class="tl-content">
              <strong style="${isPending ? 'opacity:0.45' : ''}">${step.label}</strong>
              <span style="${isPending ? 'opacity:0.4' : ''}">${step.desc}</span>
              ${timeEntry ? `<div class="tl-time">${new Date(timeEntry.time).toLocaleTimeString('en-CH', { hour: '2-digit', minute: '2-digit' })}</div>` : ''}
            </div>
          </div>`;
      }).join('');

      const itemsHtml = order.items.map(i => `
        <div class="side-item">
          <span>${i.emoji}</span>
          <span style="flex:1">${i.name}</span>
          <span style="color:var(--ink-soft)">×${i.qty}</span>
          <span class="side-total">${formatPrice(i.price * i.qty)}</span>
        </div>`).join('');

      return `
        <div class="tracking-layout">
          <div>
            <!-- Status hero -->
            <div class="status-hero">
              <div class="status-big-icon">${currentStep.icon}</div>
              <div class="status-big-label">${currentStep.label}</div>
              <div class="status-big-desc">${currentStep.desc}</div>
              ${!isDelivered ? `<div class="eta-pill">⏱ ETA: ${ETA_BY_STEP[order.status] || '~30 min'}</div>` : ''}
            </div>

            <!-- Progress -->
            <div class="track-card">
              <h3>📊 Progress</h3>
              <div class="progress-track">
                <div class="progress-fill" style="width:${progress}%"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--ink-soft)">
                <span>Confirmed</span><span>${order.deliveryType === 'delivery' ? 'Delivered' : 'Collected'}</span>
              </div>
              <div style="margin-top:24px;">
                <div class="timeline">${timelineHtml}</div>
              </div>

              ${!isDelivered ? `
              <div class="demo-controls">
                <p>🎮 Demo: Simulate order progress</p>
                <button onclick="advanceStatus()">Advance Status →</button>
              </div>` : `
              <div style="text-align:center; margin-top:20px;">
                <a href="menu.html" class="btn btn-primary">Order Again 🍛</a>
              </div>`}
            </div>
          </div>

          <!-- Sidebar -->
          <div>
            <div class="order-summary-side">
              <h3>🧾 Order #${order.id}</h3>
              ${itemsHtml}
              <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--mist);">
                <div class="info-row"><span class="label">Total</span><span class="side-total">${formatPrice(order.total)}</span></div>
                <div class="info-row"><span class="label">Payment</span><span>${order.paymentMethod === 'card' ? '💳' : order.paymentMethod === 'twint' ? '📱' : '💶'} ${order.paymentMethod}</span></div>
                <div class="info-row"><span class="label">Type</span><span>${order.deliveryType === 'delivery' ? '🛵 Delivery' : '🏠 Pickup'}</span></div>
                ${order.deliveryType === 'delivery' ? `<div class="info-row" style="flex-direction:column; align-items:flex-start; gap:2px;"><span class="label">Address</span><span style="font-size:0.82rem;">${order.customer.address}</span></div>` : ''}
                <div class="info-row"><span class="label">Placed</span><span>${new Date(order.placedAt).toLocaleTimeString('en-CH', { hour:'2-digit', minute:'2-digit' })}</span></div>
              </div>
              <a href="index.html" class="btn btn-secondary" style="width:100%;margin-top:16px;text-align:center;">← Back to Home</a>
            </div>
          </div>
        </div>`;
    }

    function showTracking(orderId) {
      const order = getOrder(orderId);
      if (!order) { showToast('Order not found', 'error'); return; }
      currentOrder = order;
      document.getElementById('mainContent').innerHTML = renderTracking(order);
    }

    function lookupOrder() {
      const id = document.getElementById('orderInput').value.trim().toUpperCase();
      if (!id) { showToast('Please enter an order ID', 'error'); return; }
      const order = getOrder(id);
      if (!order) { showToast('Order not found. Check your order ID.', 'error'); return; }
      showTracking(id);
    }

    function advanceStatus() {
      if (!currentOrder) return;
      const steps = getSteps(currentOrder);
      const idx = steps.findIndex(s => s.key === currentOrder.status);
      if (idx >= steps.length - 1) return;
      const nextStep = steps[idx + 1];
      currentOrder.status = nextStep.key;
      if (!currentOrder.timeline) currentOrder.timeline = [];
      currentOrder.timeline.push({ status: nextStep.key, label: nextStep.label, time: new Date().toISOString() });

      // Persist
      const orders = getOrders();
      const i = orders.findIndex(o => o.id === currentOrder.id);
      if (i > -1) orders[i] = currentOrder;
      localStorage.setItem('elaichi_orders', JSON.stringify(orders));

      document.getElementById('mainContent').innerHTML = renderTracking(currentOrder);
      showToast(`Status updated: ${nextStep.label}`);
    }

    // Init
    const params = new URLSearchParams(location.search);
    const orderId = params.get('order');
    if (orderId) {
      showTracking(orderId);
    } else {
      document.getElementById('mainContent').innerHTML = renderLookup(getOrders());
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('orderInput')) lookupOrder();
    });

    function toggleMenu() {
      document.getElementById('hamburger').classList.toggle('open');
      document.getElementById('mobileMenu').classList.toggle('open');
      document.body.style.overflow = document.getElementById('mobileMenu').classList.contains('open') ? 'hidden' : '';
    }
    function closeMenu(e) {
      if (e.target === document.getElementById('mobileMenu')) {
        document.getElementById('hamburger').classList.remove('open');
        document.getElementById('mobileMenu').classList.remove('open');
        document.body.style.overflow = '';
      }
    }
  </script>
</body>
</html>
